name: LEO Suite Check

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/verify-leo-suite.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/leo-suite-check.yml'
  push:
    branches:
      - feature/leo-command-suite

jobs:
  verify-leo-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src scripts -name '*.js' -print0)

      - name: Verify LEO command suite
        env:
          OWNER_IDS: '999999999999999999'
          CLIENT_ID: '999999999999999999'
          DISCORD_TOKEN: 'verification-only-not-a-real-token'
        run: node scripts/verify-leo-suite.js
